<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B0D10"><animate attributeName="stop-color" values="#0B0D10;#101820;#0B0D10" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#12151B"><animate attributeName="stop-color" values="#12151B;#0D1420;#12151B" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="voltgrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C8FF3D"/><stop offset="1" stop-color="#67E8F9"/>
  </linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#1B1F27" stroke-width="1"/>
  </pattern>
  <style>
    .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 3.2s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .fadein{opacity:0;animation:fadein 1.4s ease forwards}
    @keyframes fadein{to{opacity:1}}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  </style>
</defs>
<rect width="1280" height="420" fill="url(#bg)"/>
<rect width="1280" height="420" fill="url(#grid)" opacity=".6"/>
<g transform="translate(640,210)">
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    <circle r="150" fill="none" stroke="#C8FF3D" stroke-opacity=".18" stroke-dasharray="4 10"/>
    <circle r="105" fill="none" stroke="#67E8F9" stroke-opacity=".22" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#3E5A6E" stroke-opacity=".55">
      <line x1="-150" y1="0" x2="150" y2="0"/><line x1="0" y1="-150" x2="0" y2="150"/>
      <line x1="-106" y1="-106" x2="106" y2="106"/><line x1="-106" y1="106" x2="106" y2="-106"/>
    </g>
    <g fill="#C8FF3D">
      <circle cx="150" cy="0" r="4"><animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="-105" cy="-105" r="3" fill="#67E8F9"/>
      <circle cx="40" cy="-98" r="3"/>
      <circle cx="-60" cy="88" r="3" fill="#FFB454"/>
      <circle cx="98" cy="60" r="3" fill="#67E8F9"/>
    </g>
  </g>
  <circle r="7" fill="#C8FF3D" class="pulse"/>
  <circle r="16" fill="none" stroke="#C8FF3D" stroke-opacity=".5" class="pulse"/>
</g>
<text x="640" y="132" text-anchor="middle" font-family="'Space Grotesk',Arial,sans-serif" font-size="86" font-weight="700" letter-spacing="6" fill="none" stroke="url(#voltgrad)" stroke-width="1.6" class="draw">VERICORE</text>
<text x="640" y="186" text-anchor="middle" font-family="'Courier New',monospace" font-size="19" letter-spacing="10" fill="#E8EAED" class="fadein" style="animation-delay:1.2s">EVERY VENDOR · ONE TRUTH</text>
<text x="640" y="330" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" letter-spacing="4" fill="#8A93A3" class="fadein" style="animation-delay:2s">VENDOR MASTER DATA INTELLIGENCE — STIBO STEP × D&amp;B × INFOR SX.e</text>
</svg>